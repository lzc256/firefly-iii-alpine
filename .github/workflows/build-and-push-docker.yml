name: Build & Push Firefly-III Alpine Image

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # 镜像名称格式: ghcr.io/用户名/仓库keepalive-job:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: gautamkrishnar/keepalive-workflow@v2
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Your Dockerfile & Configs
        uses: actions/checkout@v6

      - name: Get Latest Firefly-III Release Tag
        id: get_release
        run: |
          # 获取官方最新 Release 的 Tag (例如 v6.1.17)
          LATEST_TAG=$(curl -s https://api.github.com/repos/firefly-iii/firefly-iii/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # 生成唯一的 Cache Key，结合 Tag 和你的代码 SHA
          echo "combined_key=firefly-${LATEST_TAG}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Cache Build Status
        id: cache_check
        uses: actions/cache@v5
        with:
          path: .build_success
          key: ${{ steps.get_release.outputs.combined_key }}

      - name: Log in to GHCR
        # 只有在版本更新或代码变动（无缓存）时才登录和构建
        if: steps.cache_check.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.cache_check.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        if: steps.cache_check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 将从 API 获取到的最新版本号传给 Dockerfile 里的 ARG
          build-args: |
            FIREFLY_VERSION=${{ steps.get_release.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_release.outputs.tag }}
          # 使用 GitHub Actions 缓存层加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mark Build Success
        if: steps.cache_check.outputs.cache-hit != 'true'
        run: echo "done" > .build_success
